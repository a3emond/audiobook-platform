name: Deploy Audiobook Platform

on:
  push:
    branches: [master]
    paths-ignore:
      - "clients/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "clients/**"

concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  pre-deploy-checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build

      # The API container runs through ts-node (npm run dev), which can reject
      # code that tsc accepts. Load the app the same way so that fails here.
      - name: API startup check (ts-node)
        if: matrix.service == 'api'
        working-directory: api
        env:
          MONGO_URI: mongodb://127.0.0.1:1/ci
          JWT_SECRET: ci
          GOOGLE_CLIENT_ID: ci
          APPLE_CLIENT_ID: ci
        run: node --loader ts-node/esm --input-type=module -e "await import(new URL('./src/app.ts', 'file://' + process.cwd() + '/').href); console.log('API modules loaded')"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: pre-deploy-checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            APP_DIR=/opt/audiobook-platform

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }} $APP_DIR
            fi

            cd $APP_DIR
            git pull origin master

            echo "${{ secrets.ENV_FILE }}" > .env

            docker compose up -d --build --remove-orphans

            docker image prune -f
