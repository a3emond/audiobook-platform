server {
  listen 80;
  client_max_body_size 4G;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  root /usr/share/nginx/html;

  # Resolve the api container per request (Docker DNS) instead of once at
  # startup, so recreating the api alone never leaves nginx on a stale IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  # index.html and the runtime env must always be revalidated, otherwise a
  # browser keeps pointing at chunk files from an old build after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  }

  location = /env.js {
    add_header Cache-Control "no-cache" always;
  }

  # Angular build output is content-hashed (main-AB12CD34.js, chunk-...):
  # cache it for good. Any missing static file gets a real 404 instead of
  # index.html - HTML parsed as JavaScript is what turned stale lazy chunks
  # into blank pages after a deploy.
  location ~* "-[A-Z0-9]{8}\.(?:js|mjs|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Unhashed static files (i18n dictionaries, logo, ...) revalidate each time.
  location ~* \.(?:js|mjs|css|map|json|woff2?|ttf|svg|png|jpe?g|webp|ico|html)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    index index.html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  }

  location ^~ /api/ {
    proxy_pass $api_upstream;
  }

  location ^~ /ws {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location ^~ /streaming/ {
    proxy_pass $api_upstream;
  }

  location ^~ /stream/ {
    proxy_pass $api_upstream;
  }
}
